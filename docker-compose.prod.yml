services:
  app:
    image: ghcr.io/apoyotecnologia02-gif/avioa-backend:latest

    container_name: avioa-backend

    ports:
      - '3000:3000'

    env_file:
      - .env.production

    volumes:
      - ./logs:/usr/src/app/logs

    restart: unless-stopped

    networks:
      - infra_network

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

networks:
  infra_network:
    external: true
