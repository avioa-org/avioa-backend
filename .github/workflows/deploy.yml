name: Build & Deploy Avioa Backend

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v3

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -f Dockerfile.prod .

      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    concurrency:
      group: avioa-backend-production
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu

            IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
            BACKUP=avioa-backend-before-deploy-$(date +%Y%m%d-%H%M%S)
            HAVE_BACKUP=false

            cd /opt/infra/projects/avioa-backend
            test -r .env.production
            docker network inspect infra_network >/dev/null
            printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker pull "$IMAGE"

            # Las migraciones terminan antes de detener el backend actual.
            docker run --rm \
              --network infra_network \
              --env-file .env.production \
              -e TZ=America/Bogota \
              "$IMAGE" \
              sh -c 'SKIP_ENV_VALIDATION=true npx prisma migrate deploy'

            rollback() {
              echo 'El despliegue no pasó las comprobaciones; restaurando el contenedor anterior.'
              if docker container inspect avioa-backend >/dev/null 2>&1; then
                docker logs --tail 60 avioa-backend || true
                docker rm -f avioa-backend || true
              fi
              if [ "$HAVE_BACKUP" = true ]; then
                docker rename "$BACKUP" avioa-backend
                docker start avioa-backend
              fi
            }

            if docker container inspect avioa-backend >/dev/null 2>&1; then
              docker stop --timeout 30 avioa-backend
              if ! docker rename avioa-backend "$BACKUP"; then
                docker start avioa-backend
                exit 1
              fi
              HAVE_BACKUP=true
            fi
            trap 'result=$?; if [ "$result" -ne 0 ]; then rollback; fi' EXIT

            docker run -d \
              --name avioa-backend \
              --network infra_network \
              --ip 172.18.0.14 \
              --restart unless-stopped \
              --env-file .env.production \
              -e TZ=America/Bogota \
              -p 3000:3000 \
              -v "$(pwd)/logs:/usr/src/app/logs" \
              "$IMAGE"

            healthy=false
            attempt=0
            while [ "$attempt" -lt 24 ]; do
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' avioa-backend)
              running=$(docker inspect -f '{{.State.Running}}' avioa-backend)
              if [ "$status" = healthy ] && [ "$running" = true ]; then healthy=true; break; fi
              if [ "$running" != true ] || [ "$status" = unhealthy ] || [ "$status" = no-healthcheck ]; then break; fi
              attempt=$((attempt + 1))
              sleep 5
            done
            if [ "$healthy" != true ]; then
              echo 'El backend no alcanzó el estado healthy.'
              exit 1
            fi

            # Verifica acceso autenticado a la API sin mostrar el token.
            docker exec avioa-backend node -e '
            (async()=>{
             if(process.env.CAZADOR_SYNC_ENABLED!=="true"){
               console.log("Conector del cazador desactivado por configuración");return;
             }
             const base=process.env.CAZADOR_API_URL,token=process.env.CAZADOR_API_TOKEN;
             if(!base||!token)throw Error("configuración incompleta");
             const response=await fetch(base.replace(/\/$/,"")+"/v1/capturas",{
               headers:{Authorization:"Bearer "+token},redirect:"error",
               signal:AbortSignal.timeout(15000)
             });
             if(!response.ok)throw Error("API HTTP "+response.status);
             const data=await response.json();
             if(!Array.isArray(data.capturas))throw Error("respuesta de API inválida");
             console.log("API del cazador: conexión autenticada OK");
            })().catch(()=>{console.error("Falló la comprobación de la API privada del cazador");process.exitCode=1;});'

            trap - EXIT
            echo 'Backend healthy; despliegue comprobado.'
            if [ "$HAVE_BACKUP" = true ]; then echo "Contenedor anterior conservado: $BACKUP"; fi
            # Solo capas sin referencia: conserva las imágenes de los respaldos.
            docker image prune -f || true
