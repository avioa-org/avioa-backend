name: Build & Deploy Avioa Backend

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v3

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -f Dockerfile.prod .

      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}

            echo "🔐 Login GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/infra/projects/avioa-backend

            echo "📥 Pulling new version..."
            docker pull $IMAGE

            echo "🗄️ Running migrations..."
            docker run --rm \
              --network infra_network \
              --env-file .env.production \
              -e TZ=America/Bogota \
              $IMAGE \
              sh -c "SKIP_ENV_VALIDATION=true npx prisma migrate deploy"

            echo "🚀 Updating container..."
            docker stop avioa-backend || true
            docker rm avioa-backend || true

            docker run -d \
              --name avioa-backend \
              --network infra_network \
              --env-file .env.production \
              -e TZ=America/Bogota \
              -p 3000:3000 \
              -v $(pwd)/logs:/usr/src/app/logs \
              $IMAGE

            echo "🕐 Verificando zona horaria..."
            docker exec avioa-backend node -e "console.log('Date:', new Date().toString()); console.log('Timezone:', Intl.DateTimeFormat().resolvedOptions().timeZone)"

            echo "🔎 Verificando contenedor..."
            if [ "$(docker inspect -f '{{.State.Running}}' avioa-backend 2>/dev/null)" != "true" ]; then
              echo "❌ avioa-backend no está ejecutándose"
              echo "📋 Logs del contenedor:"
              docker logs avioa-backend --tail 100
              exit 1
            fi

            echo "✅ avioa-backend está ejecutándose"

            echo "⏳ Esperando healthcheck..."
            for i in {1..12}; do
              STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' avioa-backend 2>/dev/null)

              echo "Healthcheck: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "💚 Healthcheck OK"
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "❌ Healthcheck falló"
                echo "📋 Logs del contenedor:"
                docker logs avioa-backend --tail 100
                exit 1
              fi

              sleep 5
            done

            echo "🧹 Cleaning old images..."
            docker image prune -af

            echo "✅ Deploy complete"
